name: Deploy Portfolio

on:
  push:
    branches: [master, main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publishes site/ to the root of gh-pages. keep_files preserves
      # /finance-dashboard and anything else already deployed there.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          # When the custom domain is ready, uncomment and set it here
          # (also add it under Settings → Pages → Custom domain):
          # cname: suryanshuvasishta.com
